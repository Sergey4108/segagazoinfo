<style>
:root{--bg:#0b1020;--panel:#121932;--line:#252e52;--text:#e8ecf7;--mute:#98a2c3;--acc:#ffb454;--ok:#4fe3a1;--bad:#ff6b7a;color-scheme:dark}
*{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth;scroll-padding-top:72px}
body{background:var(--bg);color:var(--text);font:400 17px/1.6 Onest,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
a{color:inherit}
:focus-visible{outline:2px solid var(--acc);outline-offset:3px;border-radius:4px}
.wrap{max-width:1040px;margin:0 auto;padding:0 24px}
header{position:sticky;top:0;z-index:5;background:rgba(11,16,32,.88);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
header .wrap{display:flex;align-items:center;justify-content:space-between;height:60px;gap:16px}
nav{display:flex;gap:22px;font-size:15px}

.lang{display:flex;border:1px solid var(--line);border-radius:999px;padding:3px}
.lang button{background:none;border:0;color:var(--mute);font:500 13px Onest;padding:4px 12px;border-radius:999px;cursor:pointer}
.lang button[aria-pressed=true]{background:var(--acc);color:#1a1200}
.logo{font:600 15px Unbounded;text-decoration:none}
section{padding:80px 0;border-top:1px solid var(--line)}
section:first-of-type{border-top:0}
h2{font:500 clamp(24px,4vw,32px)/1.2 Unbounded;margin-bottom:36px}
.hero{padding:64px 0 80px}
.hero .wrap{display:grid;grid-template-columns:1.05fr 1fr;gap:48px;align-items:center}
.me{display:flex;align-items:center;gap:16px;margin-bottom:28px}
.me img{width:76px;height:76px;border-radius:50%;object-fit:cover;filter:grayscale(1);border:2px solid var(--line)}
.me span{color:var(--mute);font-size:15px}
h1{font:600 clamp(34px,5.4vw,56px)/1.08 Unbounded;letter-spacing:-.02em}
.lead{margin:22px 0 30px;color:var(--mute);max-width:46ch;font-size:18px}
.btns{display:flex;flex-wrap:wrap;gap:12px}
.btn{display:inline-block;padding:12px 20px;border-radius:10px;text-decoration:none;font-weight:500;border:1px solid var(--line);transition:border-color .2s,background .2s}
.btn:hover{border-color:var(--acc)}
.btn.p{background:var(--acc);border-color:var(--acc);color:#1a1200}
.btn.p:hover{background:#ffc47a}
.term{background:#080c19;border:1px solid var(--line);border-radius:14px;font:400 13.5px/1.7 'JetBrains Mono',monospace;overflow:hidden}
.term .bar{display:flex;justify-content:space-between;padding:10px 16px;border-bottom:1px solid var(--line);color:var(--mute);font-size:12px}
.term pre{padding:16px;min-height:290px;white-space:pre-wrap;overflow-x:auto}
.ok{color:var(--ok)}.bad{color:var(--bad)}.mu{color:var(--mute)}
.cur::after{content:"▍";color:var(--acc);animation:bl 1s steps(2) infinite}
@keyframes bl{50%{opacity:0}}
.stats{display:flex;flex-wrap:wrap;gap:12px 40px;margin-top:44px;color:var(--mute);font-size:15px}
.stats b{color:var(--text);font-weight:600}
.job{display:grid;grid-template-columns:200px 1fr;gap:12px 32px;padding:28px 0;border-top:1px solid var(--line)}
.job:first-of-type{border-top:0;padding-top:0}
.when{color:var(--mute);font-size:15px}
.job h3{font:600 20px/1.3 Onest}
.job .meta{color:var(--mute);font-size:15px;margin-bottom:12px}
details{border:1px solid var(--line);border-radius:10px;margin-top:8px;background:var(--panel)}
summary{cursor:pointer;padding:10px 16px;font-weight:500;font-size:15px;list-style:none;display:flex;justify-content:space-between}
summary::-webkit-details-marker{display:none}
summary::after{content:"+";color:var(--acc);font-size:20px;line-height:1}

details li{margin-top:4px}

.about{display:grid;grid-template-columns:1.2fr 1fr;gap:48px}

.about dl{display:grid;gap:18px}

.contact p{color:var(--mute);margin-bottom:24px;max-width:50ch}

footer{padding:28px 0;border-top:1px solid var(--line);color:var(--mute);font-size:14px}

@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}.cur::after{animation:none}}
</style>

function typeRun(){
